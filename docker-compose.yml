services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PORT=5678
      - N8N_LICENSE_ACTIVATION_KEY=${N8N_LICENSE_ACTIVATION_KEY}
      - N8N_PROXY_HOPS=1

      # --- n8n Assistant ---
      - N8N_ENABLED_MODULES=instance-ai
      - N8N_INSTANCE_AI_MODEL=openrouter/${OPENROUTER_MODEL}
      - N8N_INSTANCE_AI_MODEL_API_KEY=${OPENROUTER_API_KEY}

      # Sandbox (required) - Daytona, recommended for production
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=daytona
      - N8N_INSTANCE_AI_SANDBOX_IMAGE=daytonaio/sandbox:0.5.3-slim
      - DAYTONA_API_URL=https://app.daytona.io/api
      - DAYTONA_API_KEY=${DAYTONA_API_KEY}

      # Web search (optional, recommended)
      - INSTANCE_AI_BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    dns:
      - 8.8.8.8
      - 1.1.1.1

  ngrok:
    image: ngrok/ngrok:latest
    container_name: n8n-tunnel
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "n8n:5678"

volumes:
  n8n_data:
    external: true